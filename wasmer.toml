[package]
name = "bayurahma/9router"
version = "0.5.104"
description = "9Router - AI Router & Token Saver on Wasmer Edge"
license = "MIT"

[dependencies]
"wasmer/winterjs" = "*"

[fs]
"/app" = "public"

[[command]]
name = "script"
module = "wasmer/winterjs:winterjs"
runner = "wasi"

[command.annotations.wasi]
main-args = ["--mode", "cloudflare", "/app"]
